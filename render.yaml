services:
  - type: web
    name: campus-lost-found
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      - key: DEMO_STAFF_PASSWORD
        sync: false
      - key: DEMO_CLAIMANT_PASSWORD
        sync: false
