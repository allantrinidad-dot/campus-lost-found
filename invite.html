<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff invitation · Beacon Lost & Found</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="polish.css"></head>
<body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>Beacon<br><em>Lost & Found</em></span></a></header><main><section class="hero" style="display:block;min-height:0;max-width:620px;margin:auto"><p class="eyebrow">Private staff invitation</p><h1 style="font-size:48px">Create your<br><i>staff account.</i></h1><p class="hero-lede">Enter the email address where you received this invitation and choose a password. The invitation can be used once.</p><form id="acceptInvite"><label>Email address<input id="inviteEmail" type="email" autocomplete="email" required></label><label>Choose password<input id="invitePassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><small class="muted">At least 10 characters.</small></label><button class="button primary full" type="submit">Create staff account <span>→</span></button><p id="inviteMessage" class="muted" role="status"></p></form></section></main></div><script>
const token=new URLSearchParams(location.search).get('token');
const form=document.getElementById('acceptInvite');
form.addEventListener('submit',async event=>{event.preventDefault();const message=document.getElementById('inviteMessage');try{const response=await fetch('/api/staff/invitations/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,email:document.getElementById('inviteEmail').value,password:document.getElementById('invitePassword').value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Invitation could not be accepted.');history.replaceState(null,'','/invite.html');message.textContent='Your staff account is ready. Opening the staff desk…';setTimeout(()=>location.assign('/'),700);}catch(error){message.textContent=error.message;}});
if(!token){form.querySelector('button').disabled=true;document.getElementById('inviteMessage').textContent='This invitation link is missing its token.';}
</script></body></html>
